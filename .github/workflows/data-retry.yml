# When a data run on main fails, re-run its failed jobs on new runners, at most
# twice (attempts 2 and 3). Failures that are left after the download fallback in
# data.yml are mostly a runner lost halfway or an unreachable site; a new runner
# usually gets through, and the finished countries are not run again.
# Only country and "official" jobs: a failed plan or publish (tests, Azure) needs
# a person. A cancelled run is left alone.
name: data-retry

on:
  workflow_run:
    workflows: [data]
    types: [completed]

permissions:
  actions: write                # re-run jobs of the data workflow; nothing else

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name')
          printf 'failed in attempt %s:\n%s\n' "$ATTEMPT" "$failed"
          if [ -z "$failed" ] || grep -qvE '^([a-z]{2} .+|official)$' <<< "$failed"; then
            echo "::warning::not re-run automatically: a job other than a country or official failed"
            exit 0
          fi
          gh run rerun "$RUN" --failed -R "$GITHUB_REPOSITORY"
          echo "re-ran the failed jobs of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN (attempt $((ATTEMPT + 1)))" | tee -a "$GITHUB_STEP_SUMMARY"
