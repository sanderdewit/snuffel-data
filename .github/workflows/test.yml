name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Syntax
        run: for f in lib/*.js tools/*.js tests/*.js; do node --check "$f"; done
      - name: Tests
        run: |
          node tests/classify.test.js
          node tests/places.test.js
          node tests/chains.test.js
          node tests/scan.test.js
          node tests/hours-scan.test.js
          node tests/hours.test.js
          node tests/i18n.test.js
