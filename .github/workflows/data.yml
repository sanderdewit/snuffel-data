# Monthly: rebuild the places dataset and the chain-ownership data for every
# country in tools/countries.json and publish both to Azure Storage.
#
#   plan     -> which countries (all, or the ones given when started by hand)
#   country  -> one parallel job per country: Geofabrik extract -> osmium ->
#               tools/build-places.js add -> places from Overture Maps that OSM lacks
#               (overture/<cc>.jsonl) -> vet register (vets/<cc>.jsonl) ->
#               website scans -> opening hours into the register; results as artifacts
#   official -> the chain groups' own clinic lists (parallel to the countries)
#   publish  -> chains.json, the 0.25-degree cells and the
#               manifest; uploaded cells first, manifest last; then the
#               changed vets/*.jsonl and overture/*.jsonl are committed straight to main
#
# If any country fails, nothing is published (the live data stays as it was):
# use "Re-run failed jobs" and publish continues with the finished ones.
# A run for only some countries publishes a manifest with only those countries.
#
# Publishing signs in to Azure with GitHub OIDC (no stored storage key): the
# publish job runs in the "publish" environment (main branch only), whose
# federated identity may only write the data and tiles containers.
# Variables: AZURE_STORAGE_ACCOUNT, AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, AZURE_OPENAI_DEPLOYMENT. Secrets: AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_KEY.
name: data

on:
  schedule:
    - cron: "17 2 3 * *"          # 02:17 UTC on the 3rd of every month
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes, space separated, or 'all'. Only these countries are published: the new manifest lists only them, so every other country is missing from the live site and app until the next full run."
        default: "all"
      scan:
        description: "Scan clinic websites for chain ownership and opening hours"
        type: boolean
        default: true
      ai:
        description: "Let the AI read opening hours on changed or new pages (off: no AI cost; unchanged pages and structured data still count)"
        type: boolean
        default: true

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          WANT: ${{ github.event.inputs.countries || 'all' }}
        run: |
          node -e '
            const all = require("./tools/countries.json").countries;
            const want = (process.env.WANT || "all").trim().toLowerCase().split(/\s+/);
            const list = want.includes("all") ? all : all.filter(c => want.includes(c.cc));
            if (!list.length) { console.error("no matching countries"); process.exit(1); }
            console.log("matrix=" + JSON.stringify(list.map(c => ({ cc: c.cc, name: c.name, geofabrik: c.geofabrik }))));
          ' >> "$GITHUB_OUTPUT"

  country:
    needs: plan
    name: ${{ matrix.cc }} ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CC: ${{ matrix.cc }}
      SCAN: ${{ github.event_name == 'schedule' || github.event.inputs.scan == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Extract places
        run: |
          set -euo pipefail
          mkdir -p work
          # Geofabrik refuses connections for minutes when many jobs download at once
          # (22 Nov 2026: six countries failed after 5 tries 30 s apart): up to 10 minutes.
          curl -fsSL --retry 10 --retry-delay 60 --retry-all-errors -o work/x.osm.pbf "https://download.geofabrik.de/${{ matrix.geofabrik }}-latest.osm.pbf"
          ls -lh work/x.osm.pbf
          osmium tags-filter work/x.osm.pbf $(node tools/build-places.js filter) -o work/x.filtered.pbf --overwrite
          rm work/x.osm.pbf
          osmium export work/x.filtered.pbf -f geojsonseq -a type,id -o work/x.geojsonseq --overwrite
          node tools/build-places.js add "$CC" work/x.geojsonseq | tee -a $GITHUB_STEP_SUMMARY
          rm -rf work

      # Places OpenStreetMap lacks, from Overture Maps (overture/<cc>.jsonl,
      # tools/overture.js: groomers, boarding, trainers, shelters, pet shops) for the countries in the
      # OVERTURE_COUNTRIES variable (default: nl). The query reads Overture's public
      # files directly (DuckDB, hash-pinned in tools/overture-requirements.txt); the
      # website checks use no AI. If the query fails, the register stays as it was;
      # without "scan" only published places are kept and new ones with a website wait.
      - name: Places from Overture Maps
        if: contains(format(' {0} ', vars.OVERTURE_COUNTRIES || 'nl'), format(' {0} ', matrix.cc))
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/overture"
          "$RUNNER_TEMP/overture/bin/pip" install --quiet --require-hashes -r tools/overture-requirements.txt
          "$RUNNER_TEMP/overture/bin/python" tools/overture.py "$CC" | tee -a "$GITHUB_STEP_SUMMARY"             || echo "::warning::Overture query for $CC failed - the register is kept"
          node tools/overture.js update "$CC" $([ "$SCAN" = true ] || echo --no-sites) | tee -a "$GITHUB_STEP_SUMMARY" "tools/.cache/overture-$CC.txt"

      # Our register of vets (vets/<cc>.jsonl, tools/vets.js) for the countries in
      # the VETS_COUNTRIES variable (default: nl be), brought in line with this
      # run's OpenStreetMap vets and the hand fixes in vets/overrides.json. The
      # opening-hours scan reads branch websites and last month's answers from it.
      - name: Vet register
        id: vets
        if: contains(format(' {0} ', vars.VETS_COUNTRIES || 'nl be'), format(' {0} ', matrix.cc))
        run: |
          set -o pipefail
          node tools/vets.js update "$CC" | tee -a "$GITHUB_STEP_SUMMARY" "tools/.cache/vets-$CC.txt"

      - name: Scan clinic websites
        if: env.SCAN == 'true'
        run: node tools/scan-websites.js "$CC" || echo "::warning::website scan for $CC failed - previous findings are kept"

      # Opening hours from the clinics' own websites, for the countries in the
      # HOURS_COUNTRIES variable (default: nl be). Unchanged pages reuse last
      # month's answer (the register, else the published hours.json), so the AI
      # only sees changes. Started by hand with "ai" off: no AI calls at all
      # (HOURS_MAX_AI 0); pages that changed wait for a run with AI.
      - name: Opening hours from clinic websites
        if: env.SCAN == 'true' && contains(format(' {0} ', vars.HOURS_COUNTRIES || 'nl be'), format(' {0} ', matrix.cc))
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          HOURS_MAX_AI: ${{ github.event.inputs.ai == 'false' && '0' || '3000' }}
        run: |
          mkdir -p dist
          curl -fsSL -o dist/previous-hours.json "https://snuffel.app/data/hours.json" || rm -f dist/previous-hours.json
          node tools/scan-hours.js "$CC" | tee -a $GITHUB_STEP_SUMMARY || echo "::warning::opening-hours scan for $CC failed - previous findings are kept"

      # The scan's answers into the register, also when the scan was skipped or
      # failed: answers are kept, confirmed or updated, and hours read from a
      # website that no scan confirmed for 180 days expire.
      - name: Vet register - opening hours
        if: ${{ !cancelled() && steps.vets.outcome == 'success' }}
        run: |
          set -o pipefail
          node tools/vets.js hours "$CC" | tee -a "$GITHUB_STEP_SUMMARY" "tools/.cache/vets-$CC.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: country-${{ matrix.cc }}
          path: |
            dist/stage/${{ matrix.cc }}.json
            tools/.cache/osm-vets-${{ matrix.cc }}.json
            tools/.cache/vets-${{ matrix.cc }}.txt
            tools/.cache/overture-${{ matrix.cc }}.txt
            tools/scan-${{ matrix.cc }}.json
            tools/hours-${{ matrix.cc }}.json
            vets/${{ matrix.cc }}.jsonl
            overture/${{ matrix.cc }}.jsonl
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  official:
    # The groups' own clinic lists. Slow on purpose (robots.txt crawl delays),
    # so it runs alongside the country jobs instead of inside publish.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Crawl the groups' clinic lists
        run: node tools/build-chains.js crawl | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-clinics
          path: tools/.cache/official-clinics.json
          retention-days: 14
          include-hidden-files: true

  publish:
    needs: [country, official]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: publish        # main only; its OIDC identity may write the storage containers
    permissions:
      contents: write           # commits the updated registers (vets/*.jsonl, overture/*.jsonl) to main
      id-token: write           # GitHub OIDC sign-in to Azure, no stored key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: country-*
          merge-multiple: true
          path: incoming
      # This run's results over the checkout: vets/<cc>.jsonl and overture/<cc>.jsonl
      # from the country jobs replace the committed ones, and that is what assemble
      # reads and what is committed below. Countries not in this run keep the committed file.
      - name: This run's country results
        run: |
          cp -a incoming/. .
          rm -rf incoming
          ls vets/*.jsonl 2>/dev/null | sed 's/^/vet register: /' || true
          ls overture/*.jsonl 2>/dev/null | sed 's/^/overture register: /' || true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: official-clinics
          path: tools/.cache

      - name: Tests
        run: |
          node tests/classify.test.js
          node tests/places.test.js
          node tests/chains.test.js
          node tests/scan.test.js
          node tests/hours-scan.test.js
          node tests/vets.test.js
          node tests/overture.test.js
          node tools/vets.js check
          node tools/overture.js check

      - name: Build chain reference data
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          mkdir -p dist
          # the live file: findings for countries not scanned this run are carried over.
          # Read through snuffel.app: the storage account only accepts Azure Front Door.
          curl -fsSL -o dist/previous-chains.json "https://snuffel.app/data/chains.json" || rm -f dist/previous-chains.json
          node tools/build-chains.js build

      - name: Opening hours from clinic websites
        run: |
          # countries not scanned this run keep last month's findings
          curl -fsSL -o dist/previous-hours.json "https://snuffel.app/data/hours.json" || rm -f dist/previous-hours.json
          node tools/scan-hours.js merge | tee -a $GITHUB_STEP_SUMMARY

      - name: Assemble places
        run: node tools/build-places.js assemble | tee -a $GITHUB_STEP_SUMMARY

      - name: Detection report
        run: |
          {
            echo '### Chain detection by country'
            echo '```'
            for f in tools/.cache/osm-vets-*.json; do
              cc=$(basename "$f" .json | sed 's/osm-vets-//')
              node tools/evaluate-chains.js "$cc" | head -5; echo
            done
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Keep the review material (not published)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-${{ github.run_id }}
          path: |
            tools/scan-*.json
            tools/chains.report.json
          retention-days: 90

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to Azure Storage
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./dist/places/manifest.json').version")
          up() { az storage blob upload-batch --account-name "$ACCOUNT" --auth-mode login --only-show-errors "$@"; }
          # 1. cells: immutable, cache for a year
          up -d data -s dist --pattern "places/$VERSION/*" --overwrite \
             --content-type application/json --content-cache-control "public, max-age=31536000, immutable"
          # 2. chain data, 3. manifest last: always fetched fresh
          up -d data -s dist --pattern "chains.json" --overwrite \
             --content-type application/json --content-cache-control "no-cache"
          up -d data -s dist --pattern "hours.json" --overwrite \
             --content-type application/json --content-cache-control "no-cache"
          up -d data -s dist --pattern "places/manifest.json" --overwrite \
             --content-type application/json --content-cache-control "no-cache"
          # keep the current and the previous version, delete older ones
          az storage blob list --account-name "$ACCOUNT" --auth-mode login -c data --prefix places/ \
             --query "[].name" -o tsv --only-show-errors \
            | sed -n 's#^places/\([0-9-]\{10\}\)/.*#\1#p' | sort -u | head -n -2 \
            | while read old; do
                az storage blob delete-batch --account-name "$ACCOUNT" --auth-mode login -s data \
                   --pattern "places/$old/*" --only-show-errors
                echo "deleted old version $old"
              done
          echo "published places $VERSION" >> $GITHUB_STEP_SUMMARY

      # Only after a successful publish: the registers as published (vets/,
      # overture/), straight to main (no pull request), so git shows every change
      # month by month. A push made with this token starts no other workflow; the
      # Tests step above has checked the registers already.
      - name: Commit the registers
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- vets overture
          if git diff --cached --quiet; then echo "registers unchanged" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo "Registers: monthly update $(date -u +%Y-%m-%d)"
            echo
            node tools/vets.js summary
            node tools/overture.js summary
            echo
            cat tools/.cache/vets-*.txt tools/.cache/overture-*.txt 2>/dev/null || true
            echo
            git diff --cached --stat | tail -n 1
            echo "Data run: $RUN_URL"
          } > "$RUNNER_TEMP/vets-message.txt"
          git commit -q -F "$RUNNER_TEMP/vets-message.txt"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              { echo '### Registers committed to main'; echo '```'; cat "$RUNNER_TEMP/vets-message.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push rejected (attempt $attempt): rebasing on main"
            git pull --rebase origin main
          done
          echo "::error::the registers could not be pushed to main"
          exit 1
