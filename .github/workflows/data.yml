# Monthly: rebuild the places dataset and the chain-ownership data for every
# country in tools/countries.json and publish both to Azure Storage.
#
#   plan     -> which countries (all, or the ones given when started by hand)
#   country  -> one parallel job per country: Geofabrik extract -> osmium ->
#               tools/build-places.js add -> website scan; results as artifacts
#   official -> the chain groups' own clinic lists (parallel to the countries)
#   publish  -> chains.json, the 0.25-degree cells and the
#               manifest; uploaded cells first, manifest last
#
# If any country fails, nothing is published (the live data stays as it was):
# use "Re-run failed jobs" and publish continues with the finished ones.
#
# Publishing signs in to Azure with GitHub OIDC (no stored storage key): the
# publish job runs in the "publish" environment (main branch only), whose
# federated identity may only write the data and tiles containers.
# Variables: AZURE_STORAGE_ACCOUNT, AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, AZURE_OPENAI_DEPLOYMENT. Secrets: AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_KEY.
name: data

on:
  schedule:
    - cron: "17 2 3 * *"          # 02:17 UTC on the 3rd of every month
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes, space separated, or 'all'"
        default: "all"
      scan:
        description: "Scan clinic websites for chain ownership"
        type: boolean
        default: true

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          WANT: ${{ github.event.inputs.countries || 'all' }}
        run: |
          node -e '
            const all = require("./tools/countries.json").countries;
            const want = (process.env.WANT || "all").trim().toLowerCase().split(/\s+/);
            const list = want.includes("all") ? all : all.filter(c => want.includes(c.cc));
            if (!list.length) { console.error("no matching countries"); process.exit(1); }
            console.log("matrix=" + JSON.stringify(list.map(c => ({ cc: c.cc, name: c.name, geofabrik: c.geofabrik }))));
          ' >> "$GITHUB_OUTPUT"

  country:
    needs: plan
    name: ${{ matrix.cc }} ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CC: ${{ matrix.cc }}
      SCAN: ${{ github.event_name == 'schedule' || github.event.inputs.scan == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Extract places
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fsSL --retry 5 --retry-delay 20 -o work/x.osm.pbf "https://download.geofabrik.de/${{ matrix.geofabrik }}-latest.osm.pbf"
          ls -lh work/x.osm.pbf
          osmium tags-filter work/x.osm.pbf $(node tools/build-places.js filter) -o work/x.filtered.pbf --overwrite
          rm work/x.osm.pbf
          osmium export work/x.filtered.pbf -f geojsonseq -a type,id -o work/x.geojsonseq --overwrite
          node tools/build-places.js add "$CC" work/x.geojsonseq | tee -a $GITHUB_STEP_SUMMARY
          rm -rf work

      - name: Scan clinic websites
        if: env.SCAN == 'true'
        run: node tools/scan-websites.js "$CC" || echo "::warning::website scan for $CC failed - previous findings are kept"

      # Opening hours from the clinics' own websites, for the countries in the
      # HOURS_COUNTRIES variable (default: nl). Unchanged pages reuse last
      # month's answer (published hours.json), so the AI only sees changes.
      - name: Opening hours from clinic websites
        if: env.SCAN == 'true' && contains(format(' {0} ', vars.HOURS_COUNTRIES || 'nl'), format(' {0} ', matrix.cc))
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          mkdir -p dist
          curl -fsSL -o dist/previous-hours.json "https://snuffel.app/data/hours.json" || rm -f dist/previous-hours.json
          node tools/scan-hours.js "$CC" | tee -a $GITHUB_STEP_SUMMARY || echo "::warning::opening-hours scan for $CC failed - previous findings are kept"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: country-${{ matrix.cc }}
          path: |
            dist/stage/${{ matrix.cc }}.json
            tools/.cache/osm-vets-${{ matrix.cc }}.json
            tools/scan-${{ matrix.cc }}.json
            tools/hours-${{ matrix.cc }}.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  official:
    # The groups' own clinic lists. Slow on purpose (robots.txt crawl delays),
    # so it runs alongside the country jobs instead of inside publish.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Crawl the groups' clinic lists
        run: node tools/build-chains.js crawl | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-clinics
          path: tools/.cache/official-clinics.json
          retention-days: 14
          include-hidden-files: true

  publish:
    needs: [country, official]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: publish        # main only; its OIDC identity may write the storage containers
    permissions:
      contents: read
      id-token: write           # GitHub OIDC sign-in to Azure, no stored key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: country-*
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: official-clinics
          path: tools/.cache

      - name: Tests
        run: |
          node tests/classify.test.js
          node tests/places.test.js
          node tests/chains.test.js
          node tests/scan.test.js
          node tests/hours-scan.test.js

      - name: Build chain reference data
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          mkdir -p dist
          # the live file: findings for countries not scanned this run are carried over.
          # Read through snuffel.app: the storage account only accepts Azure Front Door.
          curl -fsSL -o dist/previous-chains.json "https://snuffel.app/data/chains.json" || rm -f dist/previous-chains.json
          node tools/build-chains.js build

      - name: Opening hours from clinic websites
        run: |
          # countries not scanned this run keep last month's findings
          curl -fsSL -o dist/previous-hours.json "https://snuffel.app/data/hours.json" || rm -f dist/previous-hours.json
          node tools/scan-hours.js merge | tee -a $GITHUB_STEP_SUMMARY

      - name: Assemble places
        run: node tools/build-places.js assemble | tee -a $GITHUB_STEP_SUMMARY

      - name: Detection report
        run: |
          {
            echo '### Chain detection by country'
            echo '```'
            for f in tools/.cache/osm-vets-*.json; do
              cc=$(basename "$f" .json | sed 's/osm-vets-//')
              node tools/evaluate-chains.js "$cc" | head -5; echo
            done
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Keep the review material (not published)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-${{ github.run_id }}
          path: |
            tools/scan-*.json
            tools/chains.report.json
          retention-days: 90

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to Azure Storage
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./dist/places/manifest.json').version")
          up() { az storage blob upload-batch --account-name "$ACCOUNT" --auth-mode login --only-show-errors "$@"; }
          # 1. cells: immutable, cache for a year
          up -d data -s dist --pattern "places/$VERSION/*" --overwrite \
             --content-type application/json --content-cache-control "public, max-age=31536000, immutable"
          # 2. chain data, 3. manifest last: always fetched fresh
          up -d data -s dist --pattern "chains.json" --overwrite \
             --content-type application/json --content-cache-control "no-cache"
          up -d data -s dist --pattern "hours.json" --overwrite \
             --content-type application/json --content-cache-control "no-cache"
          up -d data -s dist --pattern "places/manifest.json" --overwrite \
             --content-type application/json --content-cache-control "no-cache"
          # keep the current and the previous version, delete older ones
          az storage blob list --account-name "$ACCOUNT" --auth-mode login -c data --prefix places/ \
             --query "[].name" -o tsv --only-show-errors \
            | sed -n 's#^places/\([0-9-]\{10\}\)/.*#\1#p' | sort -u | head -n -2 \
            | while read old; do
                az storage blob delete-batch --account-name "$ACCOUNT" --auth-mode login -s data \
                   --pattern "places/$old/*" --only-show-errors
                echo "deleted old version $old"
              done
          echo "published places $VERSION" >> $GITHUB_STEP_SUMMARY
