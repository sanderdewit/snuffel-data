# Quarterly: cut our countries (tiles/region.geojson) out of the latest Protomaps planet build and
# publish them as one .pmtiles file the site's map reads with range requests.
# Self-hosted tiles: no tile provider account, no per-view fees, and allowed for
# commercial use (OpenStreetMap data, ODbL; Protomaps basemap, BSD/ODbL).
name: tiles

on:
  schedule:
    - cron: "41 3 7 1,4,7,10 *"   # 03:41 UTC on the 7th of Jan/Apr/Jul/Oct
  workflow_dispatch:
    inputs:
      maxzoom:
        description: "Highest zoom level (14 is ~4x smaller than 15; vector tiles overzoom smoothly)"
        default: "14"

concurrency:
  group: tiles
  cancel-in-progress: false

permissions:
  contents: read

env:
  PMTILES_VERSION: "1.31.2"
  # go-pmtiles publishes no checksum file, so the binary is pinned by hash
  # (matches GitHub's asset digest). Update both together when upgrading.
  PMTILES_SHA256: "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f"
  MAXZOOM: ${{ github.event.inputs.maxzoom || '14' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: publish        # main only; its OIDC identity may write the storage containers
    permissions:
      contents: read
      id-token: write           # GitHub OIDC sign-in to Azure, no stored key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pmtiles CLI (hash pinned)
        run: |
          set -euo pipefail
          file="go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$file" "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/$file"
          echo "${PMTILES_SHA256}  $file" | sha256sum -c -
          tar -xzf "$file" pmtiles && sudo mv pmtiles /usr/local/bin/
          pmtiles version

      - name: Free disk space (the Europe extract is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Extract our countries from the latest planet build
        run: |
          set -euo pipefail
          KEY=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | jq -r '.[-1].key')
          echo "source build: $KEY" | tee -a $GITHUB_STEP_SUMMARY
          pmtiles extract "https://build.protomaps.com/$KEY" snuffel.pmtiles \
            --region=tiles/region.geojson --maxzoom="$MAXZOOM" --download-threads=8
          ls -lh snuffel.pmtiles | tee -a $GITHUB_STEP_SUMMARY
          pmtiles show snuffel.pmtiles > tiles-info.txt   # not piped into head: SIGPIPE would fail the step under pipefail
          head -20 tiles-info.txt

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to Azure Storage
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          az storage blob upload --account-name "$ACCOUNT" --auth-mode login --only-show-errors \
            -c tiles -n snuffel.pmtiles -f snuffel.pmtiles --overwrite \
            --content-type application/vnd.pmtiles --content-cache-control "public, max-age=86400"
          echo "published tiles/snuffel.pmtiles" >> $GITHUB_STEP_SUMMARY

      # Front Door caches byte ranges of the file for a day. After a new upload
      # it would serve a mix of old and new ranges (an old index pointing into
      # the new file = an empty map), so the cached ranges are purged at once.
      # The publish identity may only purge the snuffel endpoint (custom role
      # "Snuffel Front Door cache purger").
      - name: Purge the Front Door cache for the tiles
        run: |
          az afd endpoint purge --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" -g RG_MPA \
            --profile-name eamp-fd-dmbqdmu72so22 --endpoint-name snuffel \
            --domains snuffel.app www.snuffel.app --content-paths '/tiles/*' --only-show-errors
          echo "purged the Front Door cache for /tiles/*" >> $GITHUB_STEP_SUMMARY
